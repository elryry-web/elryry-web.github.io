<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Doodle Wonders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe8ff; font-family: Fredoka, 'Trebuchet MS', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }

  #title { position: fixed; left: 16px; top: 10px; font-weight: 700; font-size: 28px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #8a6bff, 0 3px 0 #6a4be0, 0 6px 14px rgba(80,40,160,.35); letter-spacing: .5px; }
  #badge { display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 600; color: #6a4be0; background: rgba(255,255,255,.75);
    padding: 2px 9px; border-radius: 10px; text-shadow: none; letter-spacing: 0; }

  #tray { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; gap: 4px; align-items: flex-end;
    padding: 10px 14px 0; background: rgba(255,255,255,.6); border-radius: 26px 26px 0 0; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 -4px 22px rgba(60,40,120,.16); max-width: calc(100vw - 210px); overflow: hidden; }
  .crayon { width: 38px; height: 78px; border: none; padding: 0; background: none; cursor: pointer; flex: none;
    transform: translateY(22px); transition: transform .22s cubic-bezier(.3,1.7,.5,1); }
  .crayon:hover { transform: translateY(14px); }
  .crayon.sel { transform: translateY(0) scale(1.06); }
  .crayon svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 3px rgba(40,20,80,.25)); }

  #tools { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 10px; align-items: flex-end; }
  .round { width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer; font-size: 28px; display: flex; align-items: center;
    justify-content: center; background: #fff; box-shadow: 0 6px 16px rgba(60,40,120,.25), inset 0 -4px 0 rgba(60,40,120,.08); transition: transform .15s; padding: 0; }
  .round:active { transform: scale(.9); }
  #wand { width: 96px; height: 96px; font-size: 46px; position: relative;
    background: radial-gradient(circle at 35% 30%, #fffbe0, #ffd84a 55%, #ff9f1c); box-shadow: 0 8px 22px rgba(255,140,0,.45), inset 0 -6px 0 rgba(200,90,0,.18); }
  #wand svg { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); pointer-events: none; transform: rotate(-90deg); }
  #wand.ready { animation: pulse .9s ease-in-out infinite; }
  #wand.idle { filter: saturate(.55) brightness(1.05); }
  @keyframes pulse { 50% { transform: scale(1.09) rotate(-6deg); } }
  #left { position: fixed; left: 14px; bottom: 14px; display: flex; gap: 10px; }
  #corner { position: fixed; right: 14px; top: 14px; display: flex; gap: 8px; }
  #corner .round { width: 44px; height: 44px; font-size: 20px; }
  .round.off { opacity: .45; }

  #bubble { position: fixed; right: 132px; top: 70px; max-width: min(320px, 52vw); background: #fff; color: #4a3a7a; font-weight: 600; font-size: 20px;
    padding: 12px 18px; border-radius: 22px; box-shadow: 0 8px 22px rgba(60,40,120,.22); opacity: 0; transform: scale(.7); transform-origin: right center;
    transition: opacity .25s, transform .3s cubic-bezier(.3,1.7,.5,1); pointer-events: none; }
  #bubble.show { opacity: 1; transform: none; }
  #bubble::after { content: ''; position: absolute; right: -10px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-left-color: #fff; border-right: 0; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.35), rgba(120,90,220,.45)); transition: opacity .5s; text-align: center; padding: 20px; }
  #start.gone { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-size: clamp(48px, 11vw, 120px); line-height: 1; color: #fff; font-weight: 700;
    text-shadow: 0 4px 0 #8a6bff, 0 8px 0 #6a4be0, 0 16px 30px rgba(60,20,140,.4); }
  #start h1 span { display: inline-block; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(3deg); } }
  #start p { color: #fff; font-size: clamp(18px, 3vw, 26px); margin: 18px 0 26px; font-weight: 600; text-shadow: 0 2px 8px rgba(60,20,140,.5); }
  #go { width: 150px; height: 150px; font-size: 64px; border-radius: 50%; border: none; cursor: pointer; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ffe680, #ffb020 60%, #ff7a1a); box-shadow: 0 12px 30px rgba(255,120,0,.5), inset 0 -8px 0 rgba(200,80,0,.25);
    animation: pulse 1.2s ease-in-out infinite; }
  #start small { margin-top: 22px; color: rgba(255,255,255,.9); font-size: 14px; }
  @media (max-width: 640px) {
    #title { font-size: 20px; } #tray { max-width: 100vw; bottom: 0; padding: 8px 8px 0; } .crayon { width: 30px; height: 64px; }
    #tools { bottom: 92px; } #wand { width: 80px; height: 80px; font-size: 38px; } #left { bottom: 92px; }
    #bubble { right: 112px; font-size: 17px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Doodle Wonders<br><span id="badge">shape guessing</span></div>
<div id="corner">
  <button class="round" id="bSound" title="Sound on/off">🔊</button>
</div>
<div id="bubble"></div>
<div id="tray"></div>
<div id="left"><button class="round" id="bClear" title="New page — sweep everything away">🧹</button></div>
<div id="tools">
  <button class="round" id="bUndo" title="Take back the last line">↩️</button>
  <button class="round idle" id="wand" title="Make it magic!">🪄<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="51" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="6" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320" id="ring"/></svg></button>
</div>
<div id="start">
  <h1><span>Doodle</span> <span style="animation-delay:.3s">Wonders</span></h1>
  <p>Draw anything… and watch it come alive! ✨</p>
  <button id="go" aria-label="Start">▶</button>
  <small>Best with sound on 🔊</small>
</div>

<script>
'use strict';
/* =====================================================================
   DOODLE WONDERS — draw anything, it comes alive.
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const cv = $('#c'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, UNIT = 1;

/* ---------------- colours ---------------- */
const CRAYONS = [
  { n: 'red', c: '#ff4d5e' }, { n: 'orange', c: '#ff9a1f' }, { n: 'yellow', c: '#ffd21f' }, { n: 'green', c: '#3fc95a' },
  { n: 'blue', c: '#2f9bff' }, { n: 'purple', c: '#9b5cff' }, { n: 'pink', c: '#ff6fc4' }, { n: 'brown', c: '#9a6338' },
  { n: 'black', c: '#3a3550' }, { n: 'rainbow', c: 'rainbow' },
];
let crayon = CRAYONS[4];
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, gg, b] = hexRGB(h); return `rgba(${r},${gg},${b},${a})`; }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }
const rainbowAt = i => `hsl(${(i * 9) % 360},92%,58%)`;
const RB = ['#ff4d5e', '#ff9a1f', '#ffd21f', '#3fc95a', '#2f9bff', '#6a5cff', '#b45cff'];

/* =====================================================================
   Sound — all synthesized
   ===================================================================== */
const Snd = {
  ctx: null, on: true, voice: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0.55; this.master.connect(c.destination);
    const len = c.sampleRate * 1.6, ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.rev = c.createConvolver(); this.rev.buffer = ir; const rg = c.createGain(); rg.gain.value = 0.35; this.rev.connect(rg).connect(this.master);
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    this.music();
  },
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c || !this.on) return;
    const t0 = c.currentTime + (o.t || 0), osc = c.createOscillator(), gn = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.slide || dur));
    const v = o.vol || 0.15;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(v, t0 + (o.a || 0.006)); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gn).connect(this.master);
    if (o.rev) { const r = c.createGain(); r.gain.value = o.rev; gn.connect(r).connect(this.rev); }
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  noise(dur, o = {}) {
    const c = this.ctx; if (!c || !this.on) return;
    const t0 = c.currentTime + (o.t || 0), src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t0); f.Q.value = o.q || 1;
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
    const gn = c.createGain(), v = o.vol || 0.2;
    gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(v, t0 + (o.a || 0.01)); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(gn).connect(this.master);
    if (o.rev) { const r = c.createGain(); r.gain.value = o.rev; gn.connect(r).connect(this.rev); }
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  },
  music() {
    const sc = [523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7, 1318.5];
    const tick = () => {
      if (this.on && Math.random() < 0.75) {
        const f = pick(sc);
        this.tone(f, 1.6, { vol: 0.022, rev: 1, a: 0.01 });
        if (Math.random() < 0.4) this.tone(f * 1.5, 1.4, { vol: 0.014, rev: 1, t: 0.2 });
      }
      setTimeout(tick, 1400 + Math.random() * 2200);
    };
    setTimeout(tick, 2000);
  },
  last: {},
  play(n, a = 0) {
    if (!this.ctx || !this.on) return;
    const now = performance.now();
    if (this.last[n] && now - this.last[n] < 45) return;
    this.last[n] = now;
    const P = [523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7, 1318.5, 1568];
    switch (n) {
      case 'note': { const f = P[clamp(Math.round(a * (P.length - 1)), 0, P.length - 1)]; this.tone(f, 0.5, { type: 'triangle', vol: 0.05, rev: 0.4 }); this.tone(f * 2, 0.25, { vol: 0.02 }); break; }
      case 'sparkle': for (let i = 0; i < 5; i++) this.tone(rand(1500, 3200), 0.4, { vol: 0.03, rev: 0.8, t: i * 0.05 }); break;
      case 'think': [659, 784, 880, 1046, 880, 784].forEach((f, i) => this.tone(f, 0.5, { vol: 0.04, rev: 0.8, t: i * 0.11, type: 'triangle' })); break;
      case 'tada': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.9, { vol: 0.08, rev: 0.8, t: i * 0.07, type: i % 2 ? 'triangle' : 'sine' })); this.noise(0.5, { type: 'highpass', f: 5000, vol: 0.04, t: 0.25 }); break;
      case 'boing': this.tone(180 + a * 120, 0.45, { type: 'sine', f2: 520 + a * 300, slide: 0.18, vol: 0.14 }); break;
      case 'land': this.tone(110, 0.18, { f2: 60, vol: 0.12 }); break;
      case 'pop': this.tone(900, 0.12, { f2: 300, vol: 0.12 }); this.noise(0.08, { type: 'highpass', f: 2000, vol: 0.08 }); break;
      case 'whoosh': this.noise(0.9, { f: 400, f2: 2200, q: 1.2, vol: 0.12, a: 0.25 }); break;
      case 'honk': this.tone(392, 0.18, { type: 'square', vol: 0.05 }); this.tone(330, 0.22, { type: 'square', vol: 0.05, t: 0.22 }); break;
      case 'vroom': this.tone(70, 1.2, { type: 'sawtooth', f2: 160, slide: 0.6, vol: 0.05 }); break;
      case 'whistle': this.tone(500, 1.0, { f2: 2200, slide: 1.0, vol: 0.05, type: 'sine' }); break;
      case 'boom': this.noise(1.4, { type: 'lowpass', f: 900, f2: 120, vol: 0.35, a: 0.005 }); this.tone(90, 0.8, { f2: 40, vol: 0.25 }); for (let i = 0; i < 12; i++) this.noise(0.05, { type: 'highpass', f: 4000, vol: 0.05, t: 0.2 + Math.random() * 1.1 }); break;
      case 'thunder': this.noise(2.2, { type: 'lowpass', f: 400, f2: 80, vol: 0.4, a: 0.02 }); break;
      case 'chirp': for (let i = 0; i < 3; i++) this.tone(2200, 0.1, { f2: 3400, slide: 0.08, vol: 0.05, t: i * 0.13 }); break;
      case 'bubble': this.tone(rand(400, 700), 0.14, { f2: rand(900, 1400), slide: 0.1, vol: 0.06 }); break;
      case 'thump': this.tone(80, 0.25, { f2: 50, vol: 0.2 }); this.tone(80, 0.2, { f2: 50, vol: 0.14, t: 0.22 }); break;
      case 'rumble': this.noise(1.8, { type: 'lowpass', f: 200, f2: 600, vol: 0.25, a: 0.3 }); break;
      case 'blast': this.noise(2.0, { type: 'lowpass', f: 300, f2: 3000, vol: 0.3, a: 0.05 }); this.tone(60, 1.6, { f2: 300, vol: 0.12, type: 'sawtooth' }); break;
      case 'twinkle': [1568, 2093, 1760, 2349, 2637].forEach((f, i) => this.tone(f, 0.6, { vol: 0.035, rev: 1, t: i * 0.09 })); break;
      case 'splash': this.noise(0.6, { type: 'bandpass', f: 1200, f2: 400, vol: 0.12 }); break;
      case 'rain': this.noise(2.5, { type: 'highpass', f: 2500, vol: 0.05, a: 0.4 }); break;
      case 'giggle': for (let i = 0; i < 4; i++) this.tone(700 + i * 40 + rand(0, 60), 0.09, { type: 'triangle', f2: 900 + i * 50, slide: 0.06, vol: 0.06, t: i * 0.1 }); break;
      case 'grow': [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.6, { type: 'triangle', vol: 0.05, rev: 0.6, t: i * 0.12 })); break;
      case 'flap': this.noise(0.1, { f: 800, vol: 0.05 }); break;
      case 'zap': this.noise(0.4, { type: 'highpass', f: 3000, vol: 0.2 }); this.tone(1200, 0.3, { type: 'sawtooth', f2: 200, vol: 0.06 }); break;
      case 'sweep': this.noise(1.2, { f: 300, f2: 3000, q: 0.8, vol: 0.16, a: 0.1 }); break;
      case 'night': [392, 330, 262].forEach((f, i) => this.tone(f, 1.6, { type: 'triangle', vol: 0.05, rev: 1, t: i * 0.25 })); break;
      case 'dance': [523, 659, 784, 659, 523, 784, 1046].forEach((f, i) => this.tone(f, 0.25, { type: 'square', vol: 0.025, t: i * 0.16 })); break;
      case 'undo': this.tone(700, 0.2, { f2: 350, vol: 0.06 }); break;
    }
  },
};

/* Voice — the narrator reads every reaction aloud */
const Voice = {
  v: null,
  pickVoice() {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    const en = vs.filter(v => /^en/i.test(v.lang));
    const pref = ['Samantha', 'Google US English', 'Aria', 'Jenny', 'Zira', 'Karen', 'Moira', 'Tessa', 'Female'];
    for (const p of pref) { const v = en.find(v => v.name.includes(p)); if (v) return this.v = v; }
    this.v = en[0] || vs[0] || null;
  },
  say(text, o = {}) {
    if (!Snd.voice || !window.speechSynthesis || !text) return;
    try {
      if (!this.v) this.pickVoice();
      if (o.cancel !== false) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s!?.,'’-]/gu, ''));
      if (this.v) u.voice = this.v;
      u.pitch = o.pitch || 1.3; u.rate = o.rate || 0.95; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { }
  },
};
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => Voice.pickVoice();

/* =====================================================================
   Scene
   ===================================================================== */
const S = {
  things: [], parts: [], flowers: [], skyStars: [], rainbows: [], flies: [], clouds: [], popups: [],
  pending: [], lives: new Map(), lastUp: 0, night: 0, nightTarget: 0, nightT: 0, flash: 0, t: 0, hills: [], grass: [], started: false,
};
function groundAt(x) { return H * 0.82 + Math.sin(x * 0.0045 + 1.2) * H * 0.018 + Math.sin(x * 0.013) * H * 0.006; }

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  UNIT = clamp(Math.min(W, H) / 800, 0.6, 1.4);
  // hills
  S.hills = [0, 1, 2].map(i => {
    const pts = [], seed = i * 7.3 + 1;
    for (let x = -20; x <= W + 20; x += 16) pts.push([x, H * (0.6 + i * 0.075) + Math.sin(x * (0.0022 + i * 0.001) + seed) * H * (0.05 - i * 0.01) + Math.sin(x * 0.007 + seed * 2) * H * 0.012]);
    return pts;
  });
  S.grass = [];
  for (let x = -4; x < W + 8; x += 5) S.grass.push({ x, h: rand(6, 15) * UNIT, ph: Math.random() * TAU, c: Math.random() });
  if (!S.clouds.length) for (let i = 0; i < 6; i++) S.clouds.push({ x: Math.random(), y: rand(0.06, 0.32), s: rand(0.6, 1.3), v: rand(0.004, 0.012), seed: Math.random() * 100 });
}
addEventListener('resize', resize);

/* ---------------- particles ---------------- */
function emit(o) { if (S.parts.length > 1600) return; S.parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 1, size: 6, color: '#fff', kind: 'spark', grav: 0, drag: 0, rot: Math.random() * TAU, vr: 0 }, o)); }
function sparkles(x, y, n, spread = 40, cols = ['#fff', '#ffe66b', '#ff9de2', '#8fe3ff']) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = rand(30, 160); emit({ x: x + Math.cos(a) * rand(0, spread), y: y + Math.sin(a) * rand(0, spread), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, drag: 2, life: rand(0.6, 1.2), size: rand(4, 10) * UNIT, color: pick(cols), kind: 'spark', vr: rand(-4, 4) }); }
}
function confetti(x, y, n, up = 1) {
  for (let i = 0; i < n; i++) { const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), sp = rand(200, 520); emit({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * up, grav: 500, drag: 1.2, life: rand(1.4, 2.4), size: rand(5, 9) * UNIT, color: pick(RB), kind: 'confetti', vr: rand(-10, 10) }); }
}
function puff(x, y, n, col = '#ffffff', sz = 18) { for (let i = 0; i < n; i++) emit({ x: x + rand(-8, 8), y: y + rand(-6, 6), vx: rand(-30, 30), vy: rand(-50, -15), drag: 1, life: rand(0.8, 1.5), size: rand(sz * 0.6, sz) * UNIT, color: col, kind: 'puff' }); }
function heartsUp(x, y, n, col = '#ff5c8a') { for (let i = 0; i < n; i++) emit({ x: x + rand(-20, 20), y, vx: rand(-30, 30), vy: rand(-110, -60), drag: 0.3, life: rand(1.6, 2.6), size: rand(9, 16) * UNIT, color: pick([col, '#ff7aa8', '#ff4d6d']), kind: 'heart', vr: rand(-1, 1) }); }

function updateParts(dt) {
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.age += dt;
    if (p.age >= p.life) { S.parts[i] = S.parts[S.parts.length - 1]; S.parts.pop(); continue; }
    if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'drop' && p.y > groundAt(p.x)) {

      if (t.y > gy) { t.y = gy; if (t.vy > 140) { t.sqv += Math.min(5, t.vy * 0.006); Snd.play('boing', clamp(t.vy / 900, 0, 1)); } t.vy = -t.vy * 0.72; t.vx *= 0.92; if (Math.abs(t.vy) < 60) t.vy = 0; }
      if (t.x < r) { t.x = r; t.vx = Math.abs(t.vx) * 0.85; } if (t.x > W - r) { t.x = W - r; t.vx = -Math.abs(t.vx) * 0.85; }

    },
  },
  beat: {
    init(t) { t.d.ty = clamp(t.y, H * 0.25, H * 0.55); t.d.n = 0; },
    update(t, dt) {
      t.y = lerp(t.y, t.d.ty + Math.sin(t.age * 0.8) * 14 * UNIT, 1 - Math.exp(-2 * dt));
      const ph = (t.age * 1.25) % 1, pulse = ph < 0.12 ? Math.sin(ph / 0.12 * Math.PI) : ph > 0.22 && ph < 0.34 ? Math.sin((ph - 0.22) / 0.12 * Math.PI) * 0.6 : 0;

    },
  },
  spin: {
    init(t) { t.d.cx = t.x; t.d.cy = clamp(t.y, H * 0.25, H * 0.6); Snd.play('whoosh'); },
    update(t, dt) {
      t.rot += dt * 6; t.d.cx += Math.sin(t.age * 0.4) * 30 * dt;
      t.x = lerp(t.x, clamp(t.d.cx + Math.cos(t.age * 0.9) * 120 * UNIT, 60, W - 60), 1 - Math.exp(-2 * dt));
      t.y = lerp(t.y, t.d.cy + Math.sin(t.age * 1.3) * 50 * UNIT, 1 - Math.exp(-2 * dt));
      if (Math.random() < dt * 14) { const a = Math.random() * TAU, r = Math.max(t.iw, t.ih) * t.sc * 0.6; emit({ x: t.x + Math.cos(a) * r, y: t.y + Math.sin(a) * r, vx: -Math.sin(a) * 160, vy: Math.cos(a) * 160, drag: 2, life: 0.7, size: 5 * UNIT, color: pick(['#fff', '#bff3ff', t.dom]), kind: 'spark' }); }
      if (Math.random() < dt * 0.3) Snd.play('whoosh');
    },
  },
  rocket: {
    init(t) { t.d.phase = 0; Snd.play('rumble'); setTimeout(() => Voice.say('Three… two… one… blast off!', { cancel: false }), 900); },
    update(t, dt) {
      const bx = t.x, by = bottomOf(t);
      if (t.age < 3.2) { fall(t, dt); t.yo = 0; t.rot = Math.sin(t.age * 40) * 0.02 * Math.min(1, t.age); if (Math.random() < dt * 20) puff(bx + rand(-30, 30), groundAt(bx) - 4, 1, '#f2eef8', 14); }
      else { if (!t.d.go) { t.d.go = true; Snd.play('blast'); t.vy = -60; } t.vy -= 520 * dt; t.y += t.vy * dt; t.rot = Math.sin(t.age * 9) * 0.02; puff(bx + rand(-6, 6), by + 8, 1, '#ffffff', 16); }
      if (t.age > 1.2) for (let i = 0; i < 2; i++) emit({ x: bx + rand(-8, 8) * UNIT, y: by, vx: rand(-30, 30), vy: rand(120, 260), life: 0.4, size: rand(8, 14) * UNIT, color: pick(['#ffd21f', '#ff9a1f', '#ff5a3a', '#fff3a8']), kind: 'glow' });
      if (t.y < -t.ih * 2) { t.dead = true; for (let i = 0; i < 8; i++) S.skyStars.push({ x: t.x + rand(-60, 60), y: rand(10, H * 0.25), s: rand(1.5, 3), ph: Math.random() * TAU, tmp: 15 }); }
    },
  },
  glow: {
    init(t) { Snd.play('grow'); },
    update(t, dt) {
      const gy = groundAt(t.x) - t.ih * t.scT / 2 + 4 * UNIT; t.y = lerp(t.y, gy, 1 - Math.exp(-5 * dt));
      t.d.smoke = (t.d.smoke || 0) - dt; if (t.d.smoke < 0) { t.d.smoke = 0.35; puff(t.x + t.iw * t.sc * 0.25, t.y - t.ih * t.sc * 0.5, 1, '#ffffff', 12); }
      if (Math.random() < dt * (0.6 + S.night * 3)) emit({ x: t.x + rand(-1, 1) * t.iw * t.sc * 0.7, y: t.y + rand(-0.5, 0.4) * t.ih * t.sc, vx: rand(-20, 20), vy: rand(-20, 5), drag: 0.4, life: 3, size: 7 * UNIT, color: '#fff27a', kind: 'glow' });
    },
    back(t) { const r = Math.max(t.iw, t.ih) * t.sc * 0.75; const gr = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, r); gr.addColorStop(0, `rgba(255,220,120,${0.35 + 0.3 * S.night + Math.sin(t.age * 2) * 0.05})`); gr.addColorStop(1, 'rgba(255,220,120,0)'); g.fillStyle = gr; g.beginPath(); g.arc(t.x, t.y, r, 0, TAU); g.fill(); },
  },
  rainbow: {

    update(t, dt) { if (t.dead) return; t.y = lerp(t.y, t.d.ty, 1 - Math.exp(-1 * dt)); if (Math.random() < dt * 4) sparkles(t.x, t.y, 1, t.iw * t.sc / 2, RB); },
  },
  stars: { // dots float up and become stars in the sky

    },

  },

    update(t, dt) {

      if (t.age > 0.5 && !t.d.f2) { t.d.f2 = true; S.flash = 0.4; }

};
function explodeInk(t, power) {
  for (const p of t.pts) {
    const a = Math.atan2(p.y, p.x), r = Math.hypot(p.x, p.y);
    const sp = (120 + r * 2.4) * power * rand(0.8, 1.25);
    emit({ x: t.x + p.x * t.sc, y: t.y + p.y * t.sc, vx: Math.cos(a) * sp + rand(-40, 40), vy: Math.sin(a) * sp + rand(-40, 40), grav: 90, drag: 1.1, life: rand(1.2, 2.2), size: rand(5, 9) * UNIT, color: p.c === '#3a3550' ? pick(RB) : p.c, kind: 'spark', vr: rand(-6, 6) });
  }

/* ---------------- updating & drawing things ---------------- */
function updateThing(t, dt) {
  t.age += dt;
  t.sqv += (-t.sq * 220 - t.sqv * 13) * dt; t.sq += t.sqv * dt; t.sq = clamp(t.sq, -0.45, 0.45);
  // googly pupils on springs
  const E = t.eye, tx = (t.d.dir || 0) * t.flip * E.r * 0.35 + (t.vx || 0) * 0.002, ty = clamp((t.vy || 0) * 0.002, -E.r * 0.4, E.r * 0.4);
  E.vx += ((tx - E.px) * 120 - E.vx * 6) * dt; E.vy += ((ty - E.py) * 120 - E.vy * 6 + 300 * (t.d.grounded ? 0 : 0.3)) * dt;
  E.px += E.vx * dt; E.py += E.vy * dt;
  const m = Math.hypot(E.px, E.py), lim = E.r * 0.45; if (m > lim) { E.px *= lim / m; E.py *= lim / m; }
  E.blink -= dt; if (E.blink < -0.12) E.blink = rand(2, 5);
  if (t.state === 'think') { t.rot = Math.sin(t.age * 9) * 0.05; t.sc = 1 + Math.sin(t.age * 6) * 0.03; if (Math.random() < dt * 30) { const a = t.age * 5 + Math.random() * 0.6, rr = Math.max(t.iw, t.ih) * 0.55 + 10; emit({ x: t.x + Math.cos(a) * rr, y: t.y + Math.sin(a) * rr, vx: 0, vy: -20, life: 0.6, size: 6 * UNIT, color: pick(['#fff', '#ffe66b', '#ff9de2', '#8fe3ff']), kind: 'spark' }); } return; }
  t.pop = Math.min(1, t.pop + dt * 2.2);
  if (t.move !== 'bloom' && t.move !== 'beat' && t.move !== 'shine' && t.move !== 'rain') t.sc = lerp(t.sc, t.scT, 1 - Math.exp(-6 * dt));
  (BEH[t.move] || BEH.walk).update(t, dt);
}
function drawThing(t) {
  const pop = t.state === 'alive' ? 1 + Math.sin(Math.min(1, t.pop) * Math.PI) * 0.25 : 1;
  const s = t.sc * pop;
  g.save(); g.globalAlpha = t.alpha;
  if (t.pivot) { const by = t.y + t.ih * s / 2; g.translate(t.x, by); g.rotate(t.rot); g.translate(0, -t.ih * s / 2); }
  else { g.translate(t.x, t.y + t.yo + t.ih * s * 0.5 * Math.max(0, t.sq)); g.rotate(t.rot); }
  g.scale(s * t.flip * (1 + t.sq * 0.6), s * (1 - t.sq));
  const sw = t.sw, sh = t.sh;
  if (t.state === 'think') { g.shadowColor = '#fff6a0'; g.shadowBlur = 20; }
  if (t.wave) {
    const strips = 14, pw = t.sprite.width / strips, cw = sw / strips;
    for (let i = 0; i < strips; i++) { const off = Math.sin(t.age * 7 - i * 0.7) * t.wave / s; g.drawImage(t.sprite, i * pw, 0, pw + 1, t.sprite.height, -sw / 2 + i * cw, -sh / 2 + off, cw + 0.6, sh); }
  } else g.drawImage(t.sprite, -sw / 2, -sh / 2, sw, sh);
  g.shadowBlur = 0;
  if (t.face && t.state === 'alive') drawEyes(t, s);
  if (t.move === 'fly' && t.state === 'alive') drawWings(t);
  g.restore();
}
function drawEyes(t, s) {
  const E = t.eye, r = E.r / Math.max(0.5, s) * Math.min(1, s * 1.4);
  const open = E.blink > 0 ? 1 : 0.12;
  for (const dx of [-1, 1]) {
    const x = E.x + dx * r * 1.05, y = E.y;
    g.fillStyle = '#fff'; g.strokeStyle = '#2b2440'; g.lineWidth = Math.max(1.5, r * 0.16);
    g.beginPath(); g.ellipse(x, y, r, r * open, 0, 0, TAU); g.fill(); g.stroke();
    if (open > 0.5) {
      g.fillStyle = '#1d1830'; g.beginPath(); g.arc(x + E.px / Math.max(0.5, s), y + E.py / Math.max(0.5, s), r * 0.5, 0, TAU); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x + E.px / Math.max(0.5, s) - r * 0.18, y + E.py / Math.max(0.5, s) - r * 0.2, r * 0.16, 0, TAU); g.fill();
    }
  }
}
function drawWings(t) {
  const flap = Math.sin(t.age * 16);
  g.save(); g.globalAlpha *= 0.75;
  for (const dx of [-1, 1]) {
    g.save(); g.translate(dx * t.iw * 0.12, -t.ih * 0.35); g.rotate(dx * (-0.5 + flap * 0.6));
    g.fillStyle = 'rgba(255,255,255,.85)'; g.strokeStyle = 'rgba(120,100,200,.6)'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(dx * t.iw * 0.18, -t.ih * 0.08, t.iw * 0.2 + 8, t.ih * 0.12 + 5, dx * 0.4, 0, TAU); g.fill(); g.stroke();
    g.restore();
  }
  g.restore();
}

/* =====================================================================
   Pip — the little star who talks to the child
   ===================================================================== */
const Pip = {
  x: 0, y: 0, m: 'idle', mt: 0, blink: 3, tBub: 0, idleT: 0,
  mood(m) { this.m = m; this.mt = 0; },
  say(text, speak = true) {
    const b = $('#bubble'); b.textContent = text; b.classList.add('show'); this.tBub = 3.6;
    if (speak) Voice.say(text);
  },
  update(dt) {
    this.x = W - 70; this.y = 104 + Math.sin(S.t * 2) * 6;
    this.mt += dt; if ((this.m === 'cheer' && this.mt > 2.2) || (this.m === 'think' && this.mt > 12)) this.mood('idle');
    this.blink -= dt; if (this.blink < -0.13) this.blink = rand(2, 5);
    if (this.tBub > 0) { this.tBub -= dt; if (this.tBub <= 0) $('#bubble').classList.remove('show'); }
    this.idleT += dt;
    if (this.idleT > 30 && !S.pending.length && !thinking) { this.idleT = 0; this.suggest(); }
    if (this.m === 'cheer' && Math.random() < dt * 10) emit({ x: this.x + rand(-30, 30), y: this.y + rand(-30, 30), vx: rand(-40, 40), vy: rand(-60, -10), drag: 1, life: 0.8, size: 6, color: pick(['#fff', '#ffe66b', '#ff9de2']), kind: 'spark' });
  },
  suggest() { this.mood('cheer'); this.say(pick(['Can you draw a sun?', 'Draw a fishy!', 'How about a rocket?', 'Draw a heart for me!', 'Can you draw a flower?', 'Draw a puppy!', 'Draw one long line… for a rainbow!', 'Draw a big balloon!', 'Can you draw a house?', 'Draw a wiggly snake!', 'Draw a star!', 'Draw a cloud full of rain!', 'Can you draw the moon?', 'Draw a car!', 'Draw a bird!'])); },
  draw() {
    const { x, y } = this, sp = this.m === 'cheer' ? Math.sin(this.mt * 10) * 0.25 : this.m === 'think' ? Math.sin(this.mt * 3) * 0.15 : Math.sin(S.t * 1.3) * 0.08;
    const jump = this.m === 'cheer' ? -Math.abs(Math.sin(this.mt * 8)) * 10 : 0;
    g.save(); g.translate(x, y + jump); g.rotate(sp);
    const gr0 = g.createRadialGradient(0, 0, 10, 0, 0, 70); gr0.addColorStop(0, 'rgba(255,240,150,.55)'); gr0.addColorStop(1, 'rgba(255,240,150,0)');
    g.fillStyle = gr0; g.beginPath(); g.arc(0, 0, 70, 0, TAU); g.fill();
    const R0 = 38, r0 = 20;
    g.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * TAU / 10, rr = i % 2 ? r0 : R0; const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.closePath(); g.lineJoin = 'round'; g.lineWidth = 10; g.strokeStyle = '#ffc93a'; g.stroke();
    const gr = g.createLinearGradient(0, -R0, 0, R0); gr.addColorStop(0, '#fff2a0'); gr.addColorStop(1, '#ffc22a');
    g.fillStyle = gr; g.fill();
    g.fillStyle = 'rgba(255,120,150,.45)'; g.beginPath(); g.ellipse(-12, 8, 5, 3, 0, 0, TAU); g.ellipse(12, 8, 5, 3, 0, 0, TAU); g.fill();
    const look = this.m === 'think' ? -3 : 0, op = this.blink > 0 ? 1 : 0.15;
    g.fillStyle = '#3a2a4a';
    for (const dx of [-7, 7]) { g.beginPath(); g.ellipse(dx + look, -2, 3.3, 4.2 * op, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#fff'; for (const dx of [-7, 7]) { if (op > 0.5) { g.beginPath(); g.arc(dx + look - 1, -3.5, 1.2, 0, TAU); g.fill(); } }
    g.strokeStyle = '#3a2a4a'; g.lineWidth = 2.2; g.lineCap = 'round'; g.beginPath();
    if (this.m === 'think') { g.arc(0, 8, 2.6, 0, TAU); } else { g.arc(0, 5, this.m === 'cheer' ? 6 : 4.5, 0.15 * Math.PI, 0.85 * Math.PI); }
    g.stroke();
    if (this.m === 'think') { g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { g.globalAlpha = 0.5 + 0.5 * Math.sin(this.mt * 5 - i); g.beginPath(); g.arc(-38 - i * 10, -30 - i * 8, 3 + i * 1.5, 0, TAU); g.fill(); } g.globalAlpha = 1; }
    g.restore();
  },
};

/* =====================================================================
   Background rendering
   ===================================================================== */
function drawSky() {
  const n = S.night;
  const gr = g.createLinearGradient(0, 0, 0, H * 0.8);
  gr.addColorStop(0, mix('#7cc8ff', '#141a4a', n)); gr.addColorStop(0.55, mix('#bfe6ff', '#2c2a6a', n)); gr.addColorStop(1, mix('#fff1d6', '#6a4a8a', n));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // stars
  for (let i = S.skyStars.length - 1; i >= 0; i--) {
    const s = S.skyStars[i];
    if (s.tmp !== undefined) { s.tmp -= 1 / 60; if (s.tmp < 0 && S.night < 0.3) { S.skyStars.splice(i, 1); continue; } }
    const a = (0.35 + 0.65 * n) * (0.5 + 0.5 * Math.sin(S.t * 3 + s.ph));
    g.save(); g.translate(s.x, s.y); g.rotate(S.t * 0.3 + s.ph); g.globalAlpha = a; g.fillStyle = '#fffbe0'; starPath(g, s.s * 3); g.fill(); g.restore();
  }
  g.globalAlpha = 1;
  // rainbows
  for (let i = S.rainbows.length - 1; i >= 0; i--) {
    const r = S.rainbows[i]; r.age += 1 / 60;
    if (r.age > r.life) { S.rainbows.splice(i, 1); continue; }
    const a = Math.min(1, r.age / 1.2, (r.life - r.age) / 2) * 0.75, bw = r.r * 0.055;
    const sweep = Math.min(1, r.age / 1.4);
    g.lineWidth = bw;
    RB.forEach((c, k) => { g.strokeStyle = rgba(c, a); g.beginPath(); g.arc(r.x, r.y, r.r - k * bw, Math.PI, Math.PI + Math.PI * sweep); g.stroke(); });
  }
}
function drawCloud(x, y, s, a) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = `rgba(${mix('#ffffff', '#8a86c0', S.night).slice(4, -1)},${a})`;
  g.beginPath(); g.arc(0, 0, 30, 0, TAU); g.arc(32, -12, 38, 0, TAU); g.arc(70, 0, 30, 0, TAU); g.arc(36, 12, 30, 0, TAU); g.fill();
  g.restore();
}
function drawHills() {
  const cols = [['#b8ecc0', '#3a4a7a'], ['#94dea0', '#2e3e6a'], ['#78cf86', '#24345a']];
  S.hills.forEach((pts, i) => {
    g.fillStyle = mix(cols[i][0], cols[i][1], S.night * 0.85);
    g.beginPath(); g.moveTo(-20, H); for (const [x, y] of pts) g.lineTo(x, y); g.lineTo(W + 20, H); g.closePath(); g.fill();
    if (i === 0) { // little trees on the far hill
      for (let k = 0; k < 6; k++) { const p = pts[Math.floor((k + 0.5) / 6 * pts.length)]; if (!p) continue; g.fillStyle = mix('#8fd49a', '#2e3e6a', S.night * 0.85); g.beginPath(); g.arc(p[0], p[1] - 10, 12, 0, TAU); g.fill(); g.fillRect(p[0] - 2, p[1] - 4, 4, 8); }
    }
  });
}
function drawGround() {
  g.fillStyle = mix('#5fc46e', '#1e4a50', S.night * 0.8);
  g.beginPath(); g.moveTo(-10, H);
  for (let x = -10; x <= W + 10; x += 10) g.lineTo(x, groundAt(x));
  g.lineTo(W + 10, H); g.closePath(); g.fill();
  const gr = g.createLinearGradient(0, H * 0.8, 0, H);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(40,120,60,.25)');
  g.fillStyle = gr; g.fillRect(0, H * 0.78, W, H * 0.22);
  // grass blades
  g.strokeStyle = mix('#7fde84', '#2e6a5a', S.night * 0.8); g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath();
  for (const b of S.grass) { const y = groundAt(b.x) + 2, sw = Math.sin(S.t * 1.8 + b.ph) * 3; g.moveTo(b.x, y); g.quadraticCurveTo(b.x + sw * 0.5, y - b.h * 0.6, b.x + sw, y - b.h); }
  g.stroke();
  // flowers grown by rain and blooms
  for (const f of S.flowers) {
    f.grow = Math.min(1, f.grow + 1 / 60 / 0.6);
    const y = groundAt(f.x) + 2, h = f.h * f.grow, sw = Math.sin(S.t * 1.5 + f.ph) * 3;
    g.strokeStyle = '#3e9a4a'; g.lineWidth = 2; g.beginPath(); g.moveTo(f.x, y); g.quadraticCurveTo(f.x, y - h * 0.5, f.x + sw, y - h); g.stroke();
    g.save(); g.translate(f.x + sw, y - h); g.rotate(S.t * 0.5 + f.ph); g.scale(f.grow * UNIT, f.grow * UNIT);
    g.fillStyle = f.c; for (let k = 0; k < f.petals; k++) { g.rotate(TAU / f.petals); g.beginPath(); g.ellipse(5, 0, 5, 3, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#ffe66b'; g.beginPath(); g.arc(0, 0, 3, 0, TAU); g.fill(); g.restore();
  }
}
function drawFlies(dt) {
  for (let i = S.flies.length - 1; i >= 0; i--) {
    const f = S.flies[i]; if (!S.things.includes(f.home)) { S.flies.splice(i, 1); continue; }
    f.a += dt * f.sp; const h = f.home;
    const x = h.x + Math.cos(f.a) * f.r, y = h.y - h.ih * h.sc * 0.3 + Math.sin(f.a * 1.7) * f.r * 0.5;
    const flap = Math.abs(Math.sin(S.t * 18 + f.r));
    g.save(); g.translate(x, y); g.fillStyle = f.c;
    g.beginPath(); g.ellipse(-4, 0, 5 * flap + 1, 4, -0.5, 0, TAU); g.ellipse(4, 0, 5 * flap + 1, 4, 0.5, 0, TAU); g.fill();
    g.fillStyle = '#3a2a4a'; g.fillRect(-0.8, -3, 1.6, 6); g.restore();
  }
}
function drawPopups(dt) {
  for (let i = S.popups.length - 1; i >= 0; i--) {
    const p = S.popups[i]; p.age += dt; if (p.age > 3.2) { S.popups.splice(i, 1); continue; }
    const k = p.age < 0.4 ? 1 - Math.pow(1 - p.age / 0.4, 3) * Math.cos(p.age * 12) : 1, a = Math.min(1, (3.2 - p.age) / 0.6);
    g.save(); g.translate(p.x, p.y - p.age * 10); g.scale(k, k); g.globalAlpha = a;
    g.font = `700 ${Math.round(30 * UNIT + 6)}px Fredoka, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(p.text).width + 34, h = 30 * UNIT + 26;
    g.fillStyle = '#fff'; g.shadowColor = 'rgba(60,40,120,.3)'; g.shadowBlur = 16; g.shadowOffsetY = 4;
    roundRect(-w / 2, -h / 2, w, h, h / 2); g.fill();
    g.shadowBlur = 0; g.shadowOffsetY = 0; g.lineWidth = 4; g.strokeStyle = p.col === '#3a3550' ? '#9b5cff' : p.col; roundRect(-w / 2, -h / 2, w, h, h / 2); g.stroke();
    g.fillStyle = '#4a3a7a'; g.fillText(p.text, 0, 2);
    g.restore();
  }
}
function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

/* =====================================================================
   Input
   ===================================================================== */
const IDLE = 2.3;
function toPt(e) { return { x: e.clientX, y: e.clientY }; }
cv.addEventListener('pointerdown', e => {
  if (!S.started) return;
  Snd.init(); Pip.idleT = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
  const p = toPt(e);
  const st = { pts: [p], color: crayon.c, w: strokeWidth(), t0: performance.now(), moved: 0, acc: 0 };
  S.lives.set(e.pointerId, st); S.pending.push(st);
  setWand(0);
});
cv.addEventListener('pointermove', e => {
  const st = S.lives.get(e.pointerId); if (!st) return;
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = toPt(ev), l = st.pts[st.pts.length - 1], d = Math.hypot(p.x - l.x, p.y - l.y);
    if (d < 2.5) continue;
    st.pts.push(p); st.moved += d; st.acc += d;
    if (st.acc > 38) { st.acc = 0; Snd.play('note', 1 - p.y / H); emit({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-50, -10), drag: 2, life: 0.7, size: rand(4, 7) * UNIT, color: pick(['#fff', '#ffe66b', '#ff9de2', '#8fe3ff']), kind: 'spark' }); }
  }
});
function endStroke(e) {
  const st = S.lives.get(e.pointerId); if (!st) return;
  S.lives.delete(e.pointerId);
  S.lastUp = performance.now();
  if (st.moved < 10 && performance.now() - st.t0 < 350) {
    // a tap: poke a creature if there is one under the finger
    const p = st.pts[0];
    for (let i = S.things.length - 1; i >= 0; i--) {
      const t = S.things[i]; if (t.state !== 'alive') continue;
      if (Math.abs(p.x - t.x) < t.iw * t.sc / 2 + 16 && Math.abs(p.y - t.y) < t.ih * t.sc / 2 + 16) {
        S.pending.splice(S.pending.indexOf(st), 1); poke(t); return;
      }
    }
  }
  if (st.pts.length === 1) Snd.play('note', 1 - st.pts[0].y / H);
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);

function setWand(k) {
  const ring = $('#ring'); ring.style.strokeDashoffset = String(320 * (1 - k));
  const w = $('#wand'); w.classList.toggle('idle', !S.pending.length); w.classList.toggle('ready', S.pending.length > 0 && !S.lives.size);
}
$('#wand').addEventListener('click', () => { Snd.init(); if (S.pending.length && !S.lives.size) interpret(); else { Pip.suggest(); } });
$('#bUndo').addEventListener('click', () => { Snd.init(); if (S.pending.length) { S.pending.pop(); Snd.play('undo'); setWand(0); } });
$('#bClear').addEventListener('click', () => {
  Snd.init(); Snd.play('sweep'); S.pending = [];
  for (const t of S.things) { t.state = 'gone'; t.vx = rand(900, 1400); }
  for (let i = 0; i < 40; i++) emit({ x: -20, y: rand(0, H), vx: rand(900, 1500), vy: rand(-60, 60), life: 1.2, size: rand(4, 9), color: pick(['#fff', '#ffe66b', '#ff9de2', '#8fe3ff']), kind: 'spark' });
  S.flowers.length = 0; S.rainbows.length = 0; S.nightTarget = 0;
  setTimeout(() => { S.things = S.things.filter(t => t.state !== 'gone'); }, 1200);
  Pip.mood('cheer'); Pip.say(pick(['A fresh new page!', 'All clean! Draw something new!', 'Whoosh! Ready to draw!']));
});
$('#bSound').addEventListener('click', () => { Snd.init(); Snd.on = !Snd.on; $('#bSound').classList.toggle('off', !Snd.on); $('#bSound').textContent = Snd.on ? '🔊' : '🔈'; });

// crayon tray
(function () {
  const tray = $('#tray');
  for (const c of CRAYONS) {
    const b = document.createElement('button'); b.className = 'crayon' + (c === crayon ? ' sel' : ''); b.title = c.n;
    const fill = c.c === 'rainbow' ? 'url(#rbw)' : c.c;
    b.innerHTML = `<svg viewBox="0 0 40 80"><defs><linearGradient id="rbw" x1="0" y1="0" x2="0" y2="1">${RB.map((k, i) => `<stop offset="${i / 6}" stop-color="${k}"/>`).join('')}</linearGradient></defs>
      <path d="M12 18 L20 2 L28 18 Z" fill="${fill}"/><path d="M17 8 L20 2 L23 8 Z" fill="rgba(0,0,0,.25)"/>
      <rect x="8" y="17" width="24" height="64" rx="5" fill="${fill}"/><rect x="8" y="28" width="24" height="12" fill="rgba(255,255,255,.55)"/><rect x="12" y="19" width="4" height="58" rx="2" fill="rgba(255,255,255,.35)"/></svg>`;
    b.addEventListener('click', () => { Snd.init(); crayon = c; S.lastUp = performance.now(); for (const x of tray.children) x.classList.remove('sel'); b.classList.add('sel'); Snd.play('note', CRAYONS.indexOf(c) / CRAYONS.length); });
    tray.appendChild(b);
  }
})();

$('#go').addEventListener('click', () => {
  Snd.init(); S.started = true; $('#start').classList.add('gone');
  Pip.mood('cheer');
  setTimeout(() => Pip.say('Hi! Draw anything, and I’ll make it magic!'), 300);
});

/* =====================================================================
   Main loop
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = Math.max(last, now);
  S.t += dt;
  // idle countdown to automatic magic
  if (S.pending.length && !S.lives.size && S.started) {
    const k = clamp((now - S.lastUp) / 1000 / IDLE, 0, 1); setWand(k);
    if (k >= 1) interpret();
  }
  if (S.nightT > 0) { S.nightT -= dt; if (S.nightT <= 0) S.nightTarget = 0; }
  S.night = lerp(S.night, S.nightTarget, 1 - Math.exp(-0.8 * dt));
  S.flash = Math.max(0, S.flash - dt * 1.5);
  for (const t of S.things) { if (t.state === 'gone') { t.x += t.vx * dt; t.rot += dt * 6; continue; } updateThing(t, dt); }
  S.things = S.things.filter(t => !t.dead);
  updateParts(dt); Pip.update(dt);

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  for (const c of S.clouds) { c.x += c.v * dt * 0.3; if (c.x > 1.15) c.x = -0.15; drawCloud(c.x * W, c.y * H, c.s * UNIT, 0.85); }
  for (const t of S.things) if (t.layer === 'back' && t.state === 'alive') { BEH[t.move].back && BEH[t.move].back(t); drawThing(t); }
  drawHills(); drawGround();
  for (const t of S.things) if (t.layer !== 'back' && t.state === 'alive' && BEH[t.move] && BEH[t.move].back) BEH[t.move].back(t);
  const order = S.things.filter(t => t.layer !== 'back' || t.state !== 'alive').sort((a, b) => (a.y + a.ih * a.sc / 2) - (b.y + b.ih * b.sc / 2));
  for (const t of order) drawThing(t);
  drawFlies(dt);
  drawParts();
  // the drawing in progress
  for (const st of S.pending) drawStroke(g, st, 1, 0, 0, true);
  drawPopups(dt);
  Pip.draw();
  if (S.flash > 0) { g.fillStyle = `rgba(255,255,240,${S.flash})`; g.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
resize();
for (let i = 0; i < 40; i++) S.skyStars.push({ x: Math.random() * W, y: Math.random() * H * 0.5, s: rand(0.8, 2), ph: Math.random() * TAU });
AI.init();
requestAnimationFrame(frame);
window.DW = { S, localGuess, interpret, reveal, makeThing, AI, BEH };
</script>
</body>
</html>

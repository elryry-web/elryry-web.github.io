<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quill &amp; Sigil · Custom Level</title>
<meta name="theme-color" content="#120d26">
<link rel="icon" type="image/png" sizes="192x192" href="../quill-and-sigil/icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #120d26; color: #f3e7cc; }
  body { display: grid; place-items: center; font: 18px Georgia, serif; text-align: center; padding: 0 16px; box-sizing: border-box; }
  a { color: #e8c27a; }
</style>
</head>
<body>
<p id="msg">Opening the level…</p>
<!--
  The play page for custom levels: shared links (play.html#level=<code>) and test play from the editor (&edit=1).
  It has no game of its own. It fetches the game's index.html from ../quill-and-sigil/, points its <base> there (so the
  game's scripts, art and icons load from the game's folder), adds custom.js after the game's scripts, and writes the
  result over this page. The game's markup, CSS and engine therefore exist once, in the game.
  Also, on this page only:
  - the game's service worker is not registered (its register call is answered with a refusal, which main.js ignores);
  - the game's manifest link is dropped, so this page does not offer to install itself as the game;
  - the tab's "lesson in play" (sessionStorage, used by the game to reopen a lesson after a reload) is cleared first,
    so a lesson played earlier in this tab is not opened under the custom level.
  custom.js holds the save off, and sends every way out to the game (or, after a test play, to the editor).
-->
<script>
(function () {
  'use strict';
  var here = location.href;
  var GAME = new URL('../quill-and-sigil/', here).href;
  var CUSTOM = new URL('js/custom.js', here).href;
  function fail(why) {
    var m = document.getElementById('msg');
    m.textContent = 'The game could not be loaded (' + why + '), so this level cannot be played right now. ';
    var a = document.createElement('a'); a.href = GAME; a.textContent = 'Try Quill & Sigil itself';
    m.appendChild(a);
  }
  try { sessionStorage.removeItem('quillsigil.playing'); } catch (e) { }
  fetch(GAME + 'index.html', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error('error ' + r.status);
    return r.text();
  }).then(function (html) {
    if (!/<head[^>]*>/i.test(html) || !/<\/body>/i.test(html)) throw new Error('the page is not the game');
    // custom.js takes the game's own cache-busting number (?v=N on main.js), so a new edition reloads it too
    var v = (/js\/main\.js\?v=(\d+)/.exec(html) || [])[1] || String(Date.now());
    var head =
      '<base href="' + GAME + '">' +
      '<script>try { if (navigator.serviceWorker) navigator.serviceWorker.register = function () {' +
      ' return Promise.reject(new Error("no service worker on the play page")); }; } catch (e) { }<\/script>';
    html = html.replace(/<head[^>]*>/i, function (m) { return m + head; })
      .replace(/<link[^>]*rel="manifest"[^>]*>/i, '')
      .replace(/<title>[\s\S]*?<\/title>/i, '<title>Quill &amp; Sigil · Custom Level</title>')
      .replace(/<\/body>/i, '<script src="' + CUSTOM + '?v=' + v + '"><\/script>\n</body>');
    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) { fail(e && e.message || 'no connection'); });
})();
</script>
</body>
</html>
